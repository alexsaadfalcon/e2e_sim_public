[pytest]
# Put the repo root on sys.path so `import e2e` resolves during collection no
# matter how the suite is launched -- bare `pytest` (as CI runs it) does NOT add
# the cwd to sys.path the way `python -m pytest` does. Resolved relative to rootdir.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --color=yes
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    sionna: requires running Sionna RT ray tracing (DrJit/LLVM). Skipped unless RUN_SIONNA=1.
    slow: long-running test (e.g. SNR sweeps). Skipped unless RUN_SLOW=1.
    gui: requires launching a live server / display. Skipped unless RUN_GUI=1.
    browser: drives the live web UI in a real headless browser (Playwright). Skipped unless RUN_BROWSER=1.
