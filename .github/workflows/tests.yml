name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch (CPU build)
        run: pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        # Sionna/GUI/slow tests auto-skip unless RUN_SIONNA/RUN_GUI/RUN_SLOW=1.
        # The default run is fully hands-off (synthetic data, no ray tracing, no display).
        run: pytest -q
